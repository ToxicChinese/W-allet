{% extends "base.html" %}
{% block judul %}Daftar{% endblock %}

{% block isi %}
<h1>Buat akun</h1>

<form action="/register" method="post">
  <label for="nama">Nama lengkap</label>
  <input id="nama" name="nama" value="{{ isi.nama }}" minlength="3" maxlength="100" required autofocus>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ isi.email }}" maxlength="100" required>

  <label for="no_hp">Nomor HP</label>
  <input id="no_hp" name="no_hp" value="{{ isi.no_hp }}" placeholder="08xxxxxxxxxx" maxlength="15" required>
  <div class="kecil">Nomor HP menjadi nomor akun untuk menerima kiriman saldo.</div>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" minlength="6" maxlength="50" required>

  <label for="ulangi">Ulangi password</label>
  <input type="password" id="ulangi" name="ulangi" minlength="6" maxlength="50" required>

  <div class="tombol-form">
    <button class="tombol">Daftar</button>
  </div>
</form>

<p class="kecil">Sudah punya akun? <a href="/login">Masuk</a></p>
{% endblock %}
