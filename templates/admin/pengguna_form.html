{% extends "base.html" %}
{% block judul %}Edit Pengguna{% endblock %}
{% block lebar %}sempit{% endblock %}

{% block isi %}
<div class="kartu">
  <h1>Edit Pengguna</h1>

  <form action="/admin/pengguna/{{ item.id }}/edit" method="post">
    <label>Email</label>
    <input value="{{ item.email }}" disabled>

    <label for="nama">Nama lengkap</label>
    <input id="nama" name="nama" value="{{ item.nama }}" minlength="3" maxlength="100" required>

    <label for="no_hp">Nomor HP</label>
    <input id="no_hp" name="no_hp" value="{{ item.no_hp }}" maxlength="15" required>

    <label>Saldo</label>
    <input value="{{ item.saldo|rupiah }}" disabled>
    <div class="kecil">Saldo hanya berubah lewat transaksi, tidak bisa diketik langsung.</div>

    <label class="centang">
      <input type="checkbox" name="aktif" {% if item.aktif %}checked{% endif %}>
      Aktif (bisa login dan bertransaksi)
    </label>

    <div class="tombol-form">
      <button class="tombol">Simpan</button>
      <a class="tombol abu" href="/admin/pengguna">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
